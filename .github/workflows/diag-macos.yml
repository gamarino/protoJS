name: Diag macOS Array.from.call(C) timing per protoCore commit
# Diagnostic only (branch diag/macos-array-from-340): times
# tests/integration/basic/array_from_ctor_scaling.js on macOS against each
# protoCore commit between v3.3.1 and v3.4.0.
on:
  push:
    branches: ['diag/macos-array-from-340']
permissions:
  contents: read
jobs:
  time:
    name: macOS ${{ matrix.ref }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: [5a8cd7c7aae68edbb34720445736b14685efae6f, 43fae387, e704be02, 6605f26c, 605df26a, e16f893c, 7a783618, f63adc0881eb00547cc42c1c1cf18c7c4941b978]
    steps:
      - uses: actions/checkout@v4
        with: { path: protoJS }
      - uses: actions/checkout@v4
        with: { repository: numaes/protoCore, ref: master, path: protoCore, fetch-depth: 0 }
      - run: git -C protoCore checkout ${{ matrix.ref }} && git -C protoCore log --oneline -1
      - run: for f in openssl@3 ninja; do brew list "$f" >/dev/null 2>&1 || brew install "$f"; done; echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: |
          cmake -S protoCore -B protoCore/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build protoCore/build --parallel 4
          cmake --install protoCore/build --prefix "$GITHUB_WORKSPACE/prefix"
      - working-directory: protoJS
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/prefix" "-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR"
          cmake --build build --parallel 4 --target protojs
          otool -L build/protojs | grep -i protoCore
      - working-directory: protoJS
        run: |
          for i in 1 2 3; do
            /usr/bin/time -l build/protojs tests/integration/basic/array_from_ctor_scaling.js 2>&1 | grep -E 'elements|ratio|FAIL|PASS|real|maximum resident' || true
          done
